# LLM Studio Configuration

# Fine-tuned model output directory
finetune_output_dir: "./finetuned_models"

# Dataset storage directory
datasets_dir: "./datasets"

# Default inference settings
inference:
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  context_length: 4096

runtime:
  backend: auto
  device: auto
  dtype: auto
  quantization: auto
  attention_backend: auto
  max_gpu_memory: 7GiB
  max_cpu_memory: auto
  cpu_offload: true
  offload_folder: ./cache/offload
  trust_remote_code: false
  inference_concurrency: 1
  queue_limit: 8
  request_timeout_seconds: 300

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repetition_penalty: 1.05
  do_sample: true
  max_context_tokens: 4096

llama_cpp:
  n_ctx: 4096
  n_gpu_layers: -1
  n_batch: 256
  n_ubatch: 128
  n_threads: 0
  flash_attn: true
  offload_kqv: true

# RAG (Retrieval-Augmented Generation) settings
rag:
  device: cpu
  embedding_model: "BAAI/bge-small-zh-v1.5"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  index_path: "./data/rag"
  system_template: |
    你是一个智能助手。请根据以下参考资料回答用户的问题。
    如果参考资料中没有相关信息，请根据你的知识回答并说明。

    参考资料:
    {context}

    用户问题: {question}

# API server settings
api:
  host: "127.0.0.1"
  port: 8000
  allowed_origins:
    - "http://127.0.0.1:5000"
    - "http://localhost:5000"
    - "http://127.0.0.1:8080"
    - "http://localhost:8080"

# API authentication. First-run setup is handled by the Flutter desktop client
# through /v1/setup/status and /v1/setup/initialize.
auth:
  enabled: true
  users_file: "./data/auth/api_users.json"
  audit_log: "./data/auth/auth_audit.log"

security:
  local_path_access:
    enabled: false
    allowed_roots:
      - "./data/imports"
      - "./data/uploads"

features:
  novel_studio:
    enabled: false
novels:
  db_path: "./data/novels/novels.sqlite"

# Unified model repository. Legacy configs with top-level models_dir are still
# migrated at load time, but new installs should use this section only.
models:
  root_dir: "./data/models"
  temp_dir: "./data/downloads"
  metadata_cache: "./data/model_index.json"
  adapters_dir: "./data/adapters"
  allow_external_paths: true
  follow_symlinks: false
  minimum_free_space_gb: 10

downloads:
  default_provider: "modelscope"
  providers:
    modelscope:
      cache_dir: "./data/cache/modelscope"
      endpoint: "https://modelscope.cn"

storage:
  trash_dir: "./data/trash/models"
  benchmarks_dir: "./data/benchmarks"
  jobs_dir: "./data/jobs"
  diagnostics_dir: "./data/diagnostics"
  cleanup:
    enabled: true
    incomplete_download_days: 7
    benchmark_retention_days: 90
    trash_retention_days: 30
    logs_retention_days: 30

# Vision model registry
vision_model_registry:
  - name: "Qwen2-VL-2B-Instruct"
    repo_id: "Qwen/Qwen2-VL-2B-Instruct"
    type: "transformers"
    size: "4.5GB"
    description: "Qwen2 Vision-Language 2B - 图文理解模型"

  - name: "Qwen2-VL-7B-Instruct"
    repo_id: "Qwen/Qwen2-VL-7B-Instruct"
    type: "transformers"
    size: "16GB"
    description: "Qwen2 Vision-Language 7B - 强大的图文理解模型"

# Default fine-tune settings
finetune:
  method: "qlora"          # lora, qlora
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  learning_rate: 0.0002
  num_epochs: 3
  per_device_train_batch_size: 1
  batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  max_seq_length: 1024
  gradient_checkpointing: true
  precision: auto
  save_steps: 100
  logging_steps: 5
  fp16: false
  bf16: false

# Popular models registry (for quick download)
model_registry:
  - name: "Qwen2.5-1.5B-Instruct"
    repo_id: "Qwen/Qwen2.5-1.5B-Instruct"
    type: "transformers"
    size: "3GB"
    description: "Qwen2.5 1.5B Instruct - lightweight Chinese/English model"

  - name: "Qwen2.5-7B-Instruct"
    repo_id: "Qwen/Qwen2.5-7B-Instruct"
    type: "transformers"
    size: "15GB"
    description: "Qwen2.5 7B Instruct - strong Chinese/English model"

  - name: "Llama-3.1-8B-Instruct"
    repo_id: "meta-llama/Llama-3.1-8B-Instruct"
    type: "transformers"
    size: "16GB"
    description: "Meta Llama 3.1 8B Instruct"

  - name: "Mistral-7B-Instruct-v0.3"
    repo_id: "mistralai/Mistral-7B-Instruct-v0.3"
    type: "transformers"
    size: "15GB"
    description: "Mistral 7B Instruct v0.3"

  - name: "Phi-3-mini-4k-instruct"
    repo_id: "microsoft/Phi-3-mini-4k-instruct"
    type: "transformers"
    size: "7.6GB"
    description: "Microsoft Phi-3 Mini 4K - compact but powerful"

  - name: "Qwen2.5-1.5B-Instruct-GGUF"
    repo_id: "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
    type: "gguf"
    filename: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
    size: "1GB"
    description: "Qwen2.5 1.5B GGUF Q4_K_M quantized"

  - name: "Llama-3.1-8B-Instruct-GGUF"
    repo_id: "bartowski/Meta-Llama-3.1-8B-Instruct-GGUF"
    type: "gguf"
    filename: "Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    size: "4.9GB"
    description: "Llama 3.1 8B GGUF Q4_K_M quantized"
