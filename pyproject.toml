[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "llm-studio"
version = "1.0.0"
description = "Cross-platform LLM download, run, and fine-tune studio"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}

[project.scripts]
llm-studio = "llm_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
